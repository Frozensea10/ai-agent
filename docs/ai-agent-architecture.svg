      <text x="110" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3436">Qdrant</text>
      <text x="110" y="38" text-anchor="middle" font-size="11" fill="#636e72">向量数据库 / RAG · 6333</text>
    </g>
    <g transform="translate(750,55)">
