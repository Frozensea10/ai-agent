      <text x="190" y="22" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3436">统一认证 · 限流熔断 · 路由转发 · 日志监控</text>
    </g>
  </g>
  
  <!-- 箭头 2 -->
  <g filter="url(#wobble)">
    <line x1="700" y1="375" x2="700" y2="418" stroke="#636e72" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="700,420 694,410 706,410" fill="#636e72"/>
  </g>
  
