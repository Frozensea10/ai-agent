  <g transform="translate(80,110)" filter="url(#wobble)">
    <path d="M0,0 h1240 a15,15 0 0 1 15,15 v110 a15,15 0 0 1 -15,15 h-1240 a15,15 0 0 1 -15,-15 v-110 a15,15 0 0 1 15,-15 z" fill="#e8f4f8" stroke="#0984e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
