      <text x="110" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3436">MinIO</text>
      <text x="110" y="38" text-anchor="middle" font-size="11" fill="#636e72">对象存储 / 文件 · 9000</text>
