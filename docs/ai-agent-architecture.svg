    <text x="200" y="30" font-size="12" fill="#636e72">Vue 3 + Element Plus + Pinia + Vite + TypeScript</text>
    
    <g transform="translate(30,50)">
      <rect x="0" y="0" width="170" height="48" rx="8" fill="#fff" stroke="#74b9ff" stroke-width="2"/>
      <text x="85" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3436">登录 Login</text>
      <text x="85" y="38" text-anchor="middle" font-size="11" fill="#636e72">AuthView</text>
    </g>
    <g transform="translate(220,50)">
      <rect x="0" y="0" width="170" height="48" rx="8" fill="#fff" stroke="#74b9ff" stroke-width="2"/>
      <text x="85" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3436">对话 Chat</text>
      <text x="85" y="38" text-anchor="middle" font-size="11" fill="#636e72">ChatView · SSE</text>
    </g>
    <g transform="translate(410,50)">
      <rect x="0" y="0" width="170" height="48" rx="8" fill="#fff" stroke="#74b9ff" stroke-width="2"/>
      <text x="85" y="21" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3436">Agent 配置</text>
      <text x="85" y="38" text-anchor="middle" font-size="11" fill="#636e72">AgentView</text>
    </g>
