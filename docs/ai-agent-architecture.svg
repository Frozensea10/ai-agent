      <text x="85" y="38" text-anchor="middle" font-size="10" fill="#636e72">HTTP / Stdio</text>
    </g>
    <g transform="translate(600,55)">
      <rect x="0" y="0" width="170" height="44" rx="8" fill="#fff" stroke="#fd79a8" stroke-width="2"/>
      <text x="85" y="22" text-anchor="middle" font-size="14" font-weight="600" fill="#2d3436">RAG 检索</text>
      <text x="85" y="38" text-anchor="middle" font-size="10" fill="#636e72">向量 + 混合检索</text>
