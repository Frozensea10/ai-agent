<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="'Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <filter id="roughPaper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="1">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
    </filter>
    <filter id="wobble" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1400" height="900" fill="#f8f5f0"/>
  <rect width="1400" height="900" fill="#f8f5f0" filter="url(#roughPaper)" opacity="0.3"/>
  
  <!-- 标题 -->
  <text x="700" y="50" text-anchor="middle" font-size="32" font-weight="700" fill="#2d3436" filter="url(#wobble)">AI Agent 智能助手系统架构图</text>
  <text x="700" y="78" text-anchor="middle" font-size="14" fill="#636e72" filter="url(#wobble)">前后端分离 + 微服务 + AI 能力层</text>
  
