    <title>登录 - AI Agent 智能助手平台</title>
    <style id="theme-vars">
:root {
  /* === Brand Colors === */
  --color-primary-50: #eff6ff;
  --color-primary-100: #dbeafe;
  --color-primary-200: #bfdbfe;
  --color-primary-300: #93c5fd;
  --color-primary-400: #60a5fa;
  --color-primary-500: #3b82f6;
  --color-primary-600: #2563eb;
  --color-primary-700: #1d4ed8;
  --color-primary-800: #1e40af;
  --color-primary-900: #1e3a8a;

  /* === Semantic Tokens (Tailwind v4 bridge) === */
  --color-background: #f8fafc;
  --color-foreground: #0f172a;
  --color-card: #ffffff;
  --color-card-foreground: #0f172a;
  --color-popover: #ffffff;
  --color-popover-foreground: #0f172a;
  --color-primary: #2563eb;
  --color-primary-foreground: #ffffff;
  --color-secondary: #f1f5f9;
  --color-secondary-foreground: #475569;
  --color-muted: #f1f5f9;
  --color-muted-foreground: #64748b;
  --color-accent: #f1f5f9;
  --color-accent-foreground: #475569;
  --color-destructive: #ef4444;
  --color-destructive-foreground: #ffffff;
  --color-border: #e2e8f0;
  --color-input: #e2e8f0;
  --color-ring: #3b82f6;
  --color-sidebar: #0f172a;
  --color-sidebar-foreground: #ffffff;
  --color-sidebar-primary: #2563eb;
  --color-sidebar-primary-foreground: #ffffff;
  --color-sidebar-accent: rgba(255,255,255,0.08);
  --color-sidebar-accent-foreground: #ffffff;

  /* === Neutral Scale === */
  --color-neutral-0: #ffffff;
  --color-neutral-50: #f8fafc;
  --color-neutral-100: #f1f5f9;
  --color-neutral-200: #e2e8f0;
  --color-neutral-300: #cbd5e1;
  --color-neutral-400: #94a3b8;
  --color-neutral-500: #64748b;
  --color-neutral-600: #475569;
  --color-neutral-700: #334155;
  --color-neutral-800: #1e293b;
  --color-neutral-900: #0f172a;

  /* === State Colors === */
  --state-success: #22c55e;
  --state-success-bg: #f0fdf4;
  --state-warning: #f59e0b;
  --state-warning-bg: #fffbeb;
  --state-error: #ef4444;
  --state-error-bg: #fef2f2;
  --state-info: #3b82f6;
  --state-info-bg: #eff6ff;

  /* === Surface Colors === */
  --surface-bg: #f8fafc;
  --surface-card: #ffffff;
  --surface-elevated: #ffffff;
  --surface-sidebar: #0f172a;
  --surface-header: #ffffff;
  --surface-overlay: rgba(15, 23, 42, 0.5);

  /* === Text Colors === */
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --text-inverse: #ffffff;
  --text-link: #2563eb;

  /* === Border Colors === */
  --border-light: #e2e8f0;
  --border-medium: #cbd5e1;
  --border-focus: #3b82f6;

  /* === Radius Scale === */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* === Shadow System === */
  --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.05), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.05), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
  --shadow-floating: 0 25px 50px -12px rgba(15, 23, 42, 0.15);

  /* === Typography === */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;

  /* === Spacing === */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;
  --space-16: 64px;

  /* === Transitions === */
  --transition-fast: 150ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms ease;
}

/* === Typography Classes === */
.font-sans { font-family: var(--font-sans); }
.font-mono { font-family: var(--font-mono); }

/* === Utility Classes === */
.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-inverse { color: var(--text-inverse); }
.text-link { color: var(--text-link); }

.bg-surface { background-color: var(--surface-bg); }
.bg-card { background-color: var(--surface-card); }
.bg-sidebar { background-color: var(--surface-sidebar); }
.bg-header { background-color: var(--surface-header); }

.border-light { border-color: var(--border-light); }
.border-medium { border-color: var(--border-medium); }

.shadow-sm { box-shadow: var(--shadow-sm); }
.shadow-md { box-shadow: var(--shadow-md); }
.shadow-lg { box-shadow: var(--shadow-lg); }
.shadow-xl { box-shadow: var(--shadow-xl); }

/* === Button Base === */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  line-height: 1.5;
  cursor: pointer;
  transition: all var(--transition-base);
  border: none;
  outline: none;
}

.btn:focus-visible {
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
}

.btn-primary {
  background-color: var(--color-primary-600);
  color: var(--text-inverse);
}

.btn-primary:hover {
  background-color: var(--color-primary-700);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}

.btn-secondary {
  background-color: var(--color-neutral-100);
  color: var(--text-secondary);
  border: 1px solid var(--border-light);
}

.btn-secondary:hover {
  background-color: var(--color-neutral-200);
}

.btn-ghost {
  background-color: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover {
  background-color: var(--color-neutral-100);
}

/* === Card Base === */
.card {
  background-color: var(--surface-card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-light);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-base), transform var(--transition-base);
}

.card:hover {
  box-shadow: var(--shadow-md);
}

/* === Input Base === */
.input {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
  background-color: var(--surface-card);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  transition: border-color var(--transition-base), box-shadow var(--transition-base);
}

.input:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
}

.input::placeholder {
  color: var(--text-tertiary);
}

/* === Tag/Badge === */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
}

.tag-success {
  background-color: var(--state-success-bg);
  color: #16a34a;
}

.tag-warning {
  background-color: var(--state-warning-bg);
  color: #d97706;
}

.tag-error {
  background-color: var(--state-error-bg);
  color: #dc2626;
}

.tag-info {
  background-color: var(--state-info-bg);
  color: #2563eb;
}

/* === Sidebar Nav Item === */
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  color: var(--text-tertiary);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-base);
  text-decoration: none;
}

.nav-item:hover {
  background-color: rgba(255, 255, 255, 0.08);
  color: var(--text-inverse);
}

.nav-item.active {
  background-color: var(--color-primary-600);
  color: var(--text-inverse);
}

/* === Scrollbar === */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--color-neutral-300);
  border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--color-neutral-400);
}

/* === Animation Keyframes === */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.animate-fade-in { animation: fadeIn 0.3s ease; }
.animate-slide-up { animation: slideUp 0.4s ease; }
.animate-pulse { animation: pulse 2s ease-in-out infinite; }

    </style>

    <style>
        :root {
            --cream: #FFF8E7;
            --cream-dark: #FFF5E6;
            --coral: #FF6B6B;
            --coral-light: #FF8E8E;
            --teal: #4ECDC4;
            --teal-dark: #45B7AA;
            --lavender: #A8A4E6;
            --golden: #FFD93D;
            --text-dark: #2D3436;
            --text-medium: #636E72;
            --text-light: #B2BEC3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Floating illustration images */
        .deco-img {
            position: absolute;
            pointer-events: none;
            z-index: 1;
        }

        /* Full-screen background image */
        .login-bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('../assets/floating-shapes.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        @media (max-width: 767px) {
            .login-bg-image {
                background-size: cover;
                opacity: 0.12;
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes slideUpBounce {
            0% { transform: translateY(40px); opacity: 0; }
            60% { transform: translateY(-8px); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-wiggle { animation: wiggle 3s ease-in-out infinite; }
        .animate-pop-in { animation: popIn 0.5s ease-out; }
        .animate-slide-up-bounce { animation: slideUpBounce 0.7s ease-out; }

        /* Main card wrapper - Apple HIG inspired proportions */
        .login-card-wrapper {
            width: 90%;
            min-width: 320px;
            max-width: 380px;
            margin: 0 auto;
        }

        /* Hand-drawn card style */
        .hand-card {
            background: #fff;
            border-radius: 24px;
            box-shadow: 8px 8px 0px rgba(255, 107, 107, 0.15), 0 4px 20px rgba(0,0,0,0.05);
            border: 3px solid var(--text-dark);
            transition: all 0.3s ease;
            padding: 32px 32px;
        }
        .hand-card:hover {
            box-shadow: 12px 12px 0px rgba(255, 107, 107, 0.2), 0 8px 30px rgba(0,0,0,0.08);
            transform: translateY(-4px) rotate(0.5deg);
        }

        /* Login header / title scale */
        .login-header {
            margin-bottom: 24px;
        }
        .login-title {
            font-size: 28px;
            line-height: 1.2;
        }
        .login-subtitle {
            font-size: 15px;
            line-height: 1.5;
        }

        /* Form spacing */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-label {
            font-size: 14px;
        }

        .login-remember {
            font-size: 14px;
        }

        /* Pill buttons */
        .btn-pill {
            border-radius: 9999px;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.5px;
            border: 3px solid var(--text-dark);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
        }
        .btn-pill:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 4px 4px 0px rgba(45, 52, 54, 0.2);
        }
        .btn-pill:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-primary-pill {
            background: var(--coral);
            color: white;
        }
        .btn-primary-pill:hover {
            background: var(--coral-light);
        }

        /* Hand-drawn input */
        .hand-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 3px solid var(--text-dark);
            background: #fff;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-dark);
            transition: all 0.2s ease;
            outline: none;
        }
        .hand-input:focus {
            border-color: var(--teal);
            box-shadow: 4px 4px 0px rgba(78, 205, 196, 0.3);
            transform: translateY(-2px);
        }
        .hand-input::placeholder {
            color: var(--text-light);
        }

        /* Checkbox hand-drawn */
        .hand-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 3px solid var(--text-dark);
            appearance: none;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }
        .hand-checkbox:checked {
            background: var(--teal);
            border-color: var(--teal-dark);
        }
        .hand-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 1px;
            width: 6px;
            height: 11px;
            border: solid white;
            border-width: 0 3px 3px 0;
            transform: rotate(45deg);
        }

        /* Link style */
        .hand-link {
            color: var(--teal-dark);
            font-weight: 600;
            text-decoration: none;
            position: relative;
            transition: color 0.2s ease;
        }
        .hand-link:hover {
            color: var(--coral);
        }

        /* Icon container */
        .icon-bubble {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid var(--text-dark);
            transition: all 0.3s ease;
        }
        .icon-bubble:hover {
            transform: scale(1.1) rotate(-5deg);
        }

        /* ===== Responsive Design ===== */
        @media (max-width: 767px) {
            body {
                padding: 16px;
                align-items: flex-start;
                min-height: 100dvh;
            }

            .deco-img {
                display: none;
            }

            .deco-bg-pattern {
                background-size: 300px;
            }

            .login-card-wrapper {

            }

            }

            }

            .login-title {
                font-size: 24px;
            }

            .login-subtitle {

            }

            .icon-bubble {

            }

            }

            form > div.flex {

            }

        }

        @media (min-width: 768px) and (max-width: 1024px) {

            }

            .hand-card {
                padding: 36px 30px;
            }

            .deco-img {
                transform: scale(0.85);
            }
        }

        /* Touch targets */
        .hand-input,
        .btn-pill,
        .hand-checkbox,
        .hand-link {
            min-height: 22px;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
