server:
  port: 8086
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  application:
    name: mcp-service
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ai_agent
    password: ai_agent123
  redis:
    host: localhost
    port: 6379
    database: 0
  doc:
    swagger-ui:
      path: /swagger-ui/index.html
      enabled: true
    api-docs:
      path: /v3/api-docs
      enabled: true

jwt:
  secret: ${JWT_SECRET:AiAgentPlatformDefaultSecretKey2026!@#$

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

logging:
  level:
    com.agent.mcp: debug
