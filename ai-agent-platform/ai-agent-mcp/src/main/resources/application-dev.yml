# 开发环境配置：仅本地开发使用，生产环境务必通过 SPRING_PROFILES_ACTIVE=prod 激活生产 profile
# 并通过环境变量 JWT_SECRET 提供强密钥（>=32 字符）
jwt:
  # 开发用固定密钥，所有模块必须保持一致，否则跨服务鉴权会失败
  secret: ${JWT_SECRET:AiAgentPlatformDevSecretKey2026!@#$}

mcp:
  admin:
    # 高危工具（code_java/code_python/db_query/http_request）允许执行的管理员用户 ID 列表（逗号分隔）
    # 默认放行 ID=1 的用户（首个注册用户），按需追加其它用户 ID
    user-ids: 1
  http:
    # http_request 工具允许访问的域名白名单（逗号分隔），仅放行需要 AI 调用的外部 API
    # 生产环境务必收敛白名单，避免 SSRF 风险
    allowed-domains: localhost,127.0.0.1
  python:
    # Windows 开发环境请使用 python.exe 的完整绝对路径（用单引号包裹避免 YAML 反斜杠转义问题）
    # 路径通过 `Get-Command python` 在 PowerShell 中确认
    executable: 'C:\Users\Administrator\AppData\Local\Programs\Python\Python312\python.exe'
