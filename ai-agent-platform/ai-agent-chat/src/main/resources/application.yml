spring:
  application:
    name: ai-agent-chat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ai_agent
    password: ${MYSQL_PASSWORD:ai_agent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  doc:
    swagger-ui:
      path: /swagger-ui/index.html
      enabled: true
    api-docs:
      path: /v3/api-docs
      enabled: true

server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 提供（>=32 字符），不提供默认值以防误用弱密钥
  secret: ${JWT_SECRET:AiAgentPlatformDevSecretKey2026!@#$}

feign:
  client:
    url:
      core-service: ${FEIGN_CORE_SERVICE_URL:http://localhost:8082}
      knowledge-service: ${FEIGN_KNOWLEDGE_SERVICE_URL:http://localhost:8084}

langchain4j:
  http:
    clientBuilderFactory: dev.langchain4j.http.client.jdk.JdkHttpClientBuilderFactory

logging:
  file:
    name: D:/Workspace/ai-agent/logs/chat.log
  level:
    com.agent.chat: debug
