spring:
  application:
    name: ai-agent-gateway-test
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/user/**

jwt:
  secret: ${JWT_SECRET:TestSecretKeyForAiAgentPlatform2026!@#$}
  access-token-expire: 86400000
  refresh-token-expire: 604800000

logging:
  level:
    root: info
