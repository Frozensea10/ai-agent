springdoc:
  enable-native-support: true

spring:
  application:
    name: ai-agent-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  codec:
    max-in-memory-size: 100MB
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://127.0.0.1:3000"
              - "http://localhost:3001"
              - "http://127.0.0.1:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/user/**
          filters:
            - StripPrefix=0
        - id: agent-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/agents/**, /api/v1/settings/**
          filters:
            - StripPrefix=0
        - id: knowledge-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/knowledge-bases/**
          filters:
            - StripPrefix=0
        - id: chat-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/sessions/**
          filters:
            - StripPrefix=0
        - id: mcp-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/mcp/**
          filters:
            - StripPrefix=0
        - id: file-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/files/**
          filters:
            - StripPrefix=0
        - id: user-service-docs
          uri: http://localhost:8081
          predicates:
            - Path=/api/user/v3/api-docs/**
          filters:
            - RewritePath=/api/user/(?<segment>.*), /$\{segment}
        - id: agent-service-docs
          uri: http://localhost:8082
          predicates:
            - Path=/api/agent/v3/api-docs/**
          filters:
            - RewritePath=/api/agent/(?<segment>.*), /$\{segment}
        - id: knowledge-service-docs
          uri: http://localhost:8084
          predicates:
            - Path=/api/knowledge/v3/api-docs/**
          filters:
            - RewritePath=/api/knowledge/(?<segment>.*), /$\{segment}
        - id: chat-service-docs
          uri: http://localhost:8083
          predicates:
            - Path=/api/chat/v3/api-docs/**
          filters:
            - RewritePath=/api/chat/(?<segment>.*), /$\{segment}
        - id: mcp-service-docs
          uri: http://localhost:8086
          predicates:
            - Path=/api/mcp/v3/api-docs/**
          filters:
            - RewritePath=/api/mcp/(?<segment>.*), /$\{segment}
        - id: file-service-docs
          uri: http://localhost:8085
          predicates:
            - Path=/api/file/v3/api-docs/**
          filters:
            - RewritePath=/api/file/(?<segment>.*), /$\{segment}

server:
  port: 8080

jwt:
  # 必须通过环境变量 JWT_SECRET 提供（>=32 字符），不提供默认值以防误用弱密钥
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: info
