spring:
  application:
    name: ai-agent-core
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ai_agent
    password: ai_agent123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:AiAgentPlatformDefaultSecretKey2026!@#$

llm:
  openai:
    api-key: ${LLM_OPENAI_API_KEY:}
  deepseek:
    api-key: ${LLM_DEEPSEEK_API_KEY:}
  qwen:
    api-key: ${LLM_QWEN_API_KEY:}
  anthropic:
    api-key: ${LLM_ANTHROPIC_API_KEY:}

logging:
  file:
    name: D:/Workspace/ai-agent/logs/core.log
  level:
    com.agent: debug
