spring:
  application:
    name: ai-agent-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ai_agent
    password: ${MYSQL_PASSWORD:ai_agent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  doc:
    swagger-ui:
      path: /swagger-ui/index.html
      enabled: true
    api-docs:
      path: /v3/api-docs
      enabled: true

server:
  port: 8082
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 提供（>=32 字符），不提供默认值以防误用弱密钥
  secret: ${JWT_SECRET}

llm:
  openai:
    api-key: ${LLM_OPENAI_API_KEY:}
  deepseek:
    api-key: ${LLM_DEEPSEEK_API_KEY:}
  qwen:
    api-key: ${LLM_QWEN_API_KEY:}
  anthropic:
    api-key: ${LLM_ANTHROPIC_API_KEY:}

logging:
  file:
    name: D:/Workspace/ai-agent/logs/core.log
  level:
    com.agent: debug
