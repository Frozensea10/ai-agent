# 开发环境配置：仅本地开发使用，生产环境务必通过 SPRING_PROFILES_ACTIVE=prod 激活生产 profile
# 并通过环境变量 JWT_SECRET / APP_ENCRYPTION_KEY 提供强密钥
jwt:
  # 开发用固定密钥，所有模块必须保持一致，否则跨服务鉴权会失败
  secret: ${JWT_SECRET:AiAgentPlatformDevSecretKey2026!@#$}
app:
  encryption:
    # 开发用固定 AES-256 密钥（base64 编码的 32 字节），生产环境务必通过环境变量
    # APP_ENCRYPTION_KEY 提供。修改此值会导致历史加密的 API Key 无法解密。
    key: ${APP_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
