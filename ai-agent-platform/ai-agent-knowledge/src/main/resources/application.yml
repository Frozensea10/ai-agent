spring:
  application:
    name: ai-agent-knowledge
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ai_agent
    password: ai_agent123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

server:
  port: 8084
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  secret: ${JWT_SECRET:AiAgentPlatformDefaultSecretKey2026!@#$

qdrant:
  host: localhost
  port: 6334
  grpc-port: 6334
  collection-prefix: ai-agent

llm:
  embedding:
    provider: openai
    model: text-embedding-3-small
    api-key: ${OPENAI_API_KEY:}

logging:
  level:
    com.agent.knowledge: debug
