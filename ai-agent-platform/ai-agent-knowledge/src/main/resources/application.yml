spring:
  application:
    name: ai-agent-knowledge
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/ai_agent?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai
    username: ai_agent
    password: ${MYSQL_PASSWORD:ai_agent123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  doc:
    swagger-ui:
      path: /swagger-ui/index.html
      enabled: true
    api-docs:
      path: /v3/api-docs
      enabled: true

server:
  port: 8084
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
    connection-timeout: 120s
  tomcat:
    connection-timeout: 120000
    max-http-post-size: -1

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 提供（>=32 字符），不提供默认值以防误用弱密钥
  secret: ${JWT_SECRET}

qdrant:
  host: localhost
  port: 6334
  grpc-port: 6334
  collection-prefix: ai-agent

rag:
  similarity-threshold: 0.3

llm:
  embedding:
    provider: openai
    model: text-embedding-3-small
    api-key: ${OPENAI_API_KEY:}

logging:
  level:
    com.agent.knowledge: debug
