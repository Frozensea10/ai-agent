spring:
  application:
    name: ai-agent-file
  main:
    allow-bean-definition-overriding: true
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        import-check:
          enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  doc:
    swagger-ui:
      path: /swagger-ui/index.html
      enabled: true
    api-docs:
      path: /v3/api-docs
      enabled: true

server:
  port: 8085
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

minio:
  endpoint: http://localhost:9000
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:minio123}
  bucket-name: ai-agent-files

jwt:
  # 生产环境请务必通过环境变量 JWT_SECRET 覆盖，不要使用默认值
  secret: ${JWT_SECRET:AiAgentPlatformDefaultSecretKey2026!@#$

logging:
  level:
    com.agent.file: debug
